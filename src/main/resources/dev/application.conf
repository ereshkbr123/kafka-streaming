# =============================================================================
# application.conf — DEV environment
#
# Loaded by run.sh via: -Dconfig.file=<path>/dev/application.conf
#
# Strategy:
#   - include classpath("application-base.conf") pulls shared config from the
#     JVM classpath root (src/main/resources/application-base.conf).
#     We use the classpath() form — not a bare include — because this file
#     lives in a subdirectory; a bare include would resolve relative to this
#     directory and fail to find the base at the classpath root.
#   - Keys below override base defaults for the dev environment.
#   - shell-vars block is parsed by BOTH the JVM (Typesafe Config) and run.sh.
# =============================================================================

include classpath("application-base.conf")

# =============================================================================
# DEV OVERRIDES — JVM-side keys that differ from base defaults
# =============================================================================

spark {
    master              = "yarn"
    checkpoint-location = "/tmp/streaming-checkpoints/kafka-to-hive-transmit"
}

kafka {
    bootstrap-servers = "dev-broker1:9093,dev-broker2:9093"
    security-protocol = "SSL"
}

# =============================================================================
# SHELL-VARIABLES BLOCK — parsed by run.sh AND JVM (Typesafe Config)
# STRICT RULES:
#   1. One key per line:  key = "value"
#   2. Values MUST be double-quoted strings
#   3. NO HOCON substitutions (${...}), NO includes, NO multiline strings
#   4. NO nested objects — flat keys only
#   5. Keys use kebab-case; bash converts to UPPER_SNAKE_CASE on load
#   6. Comments (#) on their own line only — never inline after a value
#   7. Opening "shell-vars {" at column 1, closing "}" at column 1
# =============================================================================
shell-vars {
    checkpoint-location  = "/tmp/streaming-checkpoints/kafka-to-hive-transmit"
    kafka-brokers        = "dev-broker1:9093,dev-broker2:9093"
    yarn-queue           = "default"
    truststore-location  = "/etc/kafka/ssl/dev/truststore.jks"
    keystore-location    = "/etc/kafka/ssl/dev/keystore.jks"
    spark-main-class     = "com.yourcompany.streaming.app.StreamingApp"
    spark-jar-path       = "kafka-hive-streaming-1.0.0.jar"
    deploy-mode          = "cluster"
}

# =============================================================================
# SPARK-CONFS — extra --conf key=value pairs for spark-submit
#
# Rules: HOCON array of quoted strings, one "spark.key=value" per element.
# No leading "--conf" (run.sh adds it). No command substitution ($() or `).
#
# Base confs (adaptive.enabled, shuffle.partitions) are duplicated here so
# run.sh, which reads only THIS file's literal text, sees the complete list.
# =============================================================================
spark-confs = [
    "spark.sql.adaptive.enabled=true"
    "spark.sql.shuffle.partitions=200"
]