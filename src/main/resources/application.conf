spark {
    app-name = "collections-customer-events"
    master = "local[2]"

    enable-hive = false

    # 15 min for prod, 1 min for local testing
    trigger-interval = "1 minute"

    # Ephemeral — shell script wipes this on every restart
    checkpoint-location = "/tmp/streaming-checkpoints/collections-customer-events"
}

kafka {
    bootstrap-servers = "localhost:9092"
    topic = "collections_customer_events"
    group-id = "collections-customer-events-cg"
    starting-offsets = "earliest"

    # For local: PLAINTEXT. For prod: SSL
    security-protocol = "PLAINTEXT"

    # Only needed when security-protocol = SSL
    ssl {
        truststore-location = ""
        truststore-password = ""
        keystore-location = ""
        keystore-password = ""
        key-password = ""
    }
}

application {
    hive-database = "default"
    hive-table = "collections_customer_events"

    # Local testing — write to parquet files
    output-path = "/tmp/streaming-output/collections-customer-events"

    # Partition
    partition-column = "audit_load_date"
    date-format = "yyyy-MM-dd"

    # Dedup primary keys — used for LEFT ANTI JOIN against target
    primary-keys = ["event_id"]

    # How many days of target data to read for dedup
    dedup-lookback-days = 2

    # Optional: fully qualified class name of custom transformer
    # Teams extend CustomTransformer trait
    # Leave empty if no custom logic needed
    custom-transformer-class = ""

    # JSON field mappings: nested path -> flat column
    json {
        fields = [
            # Root level
            { name = "event_id",        path = "event_id",                    type = "string" }
            { name = "event_timestamp",  path = "event_timestamp",            type = "string" }

            # customer object
            { name = "customer_id",     path = "customer.customer_id",        type = "string" }
            { name = "first_name",      path = "customer.first_name",         type = "string" }
            { name = "last_name",       path = "customer.last_name",          type = "string" }
            { name = "risk_rating",     path = "customer.risk_rating",        type = "string" }

            # contact object
            { name = "email",           path = "contact.email",               type = "string" }
            { name = "phone_mobile",    path = "contact.phone_mobile",        type = "string" }

            # address object
            { name = "city",            path = "address.city",                type = "string" }
            { name = "state",           path = "address.state",               type = "string" }
            { name = "country",         path = "address.country",             type = "string" }

            # loan_account object
            { name = "account_id",      path = "loan_account.account_id",     type = "string" }
            { name = "loan_amount",     path = "loan_account.loan_amount",    type = "integer" }
            { name = "interest_rate",   path = "loan_account.interest_rate",  type = "double" }

            # delinquency object
            { name = "days_past_due",   path = "delinquency.days_past_due",   type = "integer" }
            { name = "bucket",          path = "delinquency.bucket",          type = "string" }
        ]
    }
}

filter {
    # Records matching ALL rules are KEPT
    # Supported operators: equals, not_equals, in, not_in, is_not_null
    rules = [
        { field = "event_id",    operator = "is_not_null" }
        { field = "customer_id", operator = "is_not_null" }
    ]
}

error {
    error-path = "/tmp/streaming-output/collections-customer-events-errors"
    enable-error-capture = true
}
