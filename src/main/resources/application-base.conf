# =============================================================================
# application-base.conf — SHARED configuration for all environments
#
# Included by application-{env}.conf via:
#   include "application-base.conf"
#
# Rules:
#   - Contains only values that are environment-INDEPENDENT or serve as
#     safe defaults that per-env files override.
#   - No shell-vars block here — that lives exclusively in per-env files.
#   - No ssl { } block — SSL paths come from shell-vars and are passed as
#     -Dssl.* JVM flags by run.sh; SSL passwords come from CLI args.
# =============================================================================

# =============================================================================
# SPARK
# =============================================================================
spark {
    app-name = "Kafka to hive transmit"

    # Per-env files override this to "yarn"
    master = "local[2]"

    enable-hive = false

    # 15 min for prod, 1 min for local testing
    trigger-interval = "1 minute"

    # Per-env files override this with the env-specific checkpoint path.
    # Value is also duplicated in shell-vars so run.sh can clear it on restart.
    checkpoint-location = "/tmp/streaming-checkpoints/kafka-to-hive-transmit"
}

# =============================================================================
# KAFKA
# =============================================================================
kafka {
    # Per-env files override bootstrap-servers and security-protocol.
    bootstrap-servers = "localhost:9092"
    topic             = "collections_customer_events"
    group-id          = "streaming_fw_test_20251024"
    starting-offsets  = "earliest"

    # For local: PLAINTEXT. Per-env files set "SSL" for cluster environments.
    security-protocol = "PLAINTEXT"

    # SSL locations and passwords are NOT in this file.
    # They are passed at runtime via -Dssl.* JVM system properties in run.sh.
    # AppConfig reads them via sys.props.getOrElse("ssl.*", "") — see AppConfig.scala.
}

# =============================================================================
# APPLICATION
# =============================================================================
application {
    hive-database = "fid1_event_cloud_t_db"
    hive-table    = "your_target_table"

    # Local testing — write to parquet files
    output-path = "/tmp/streaming-output/kafka-to-hive-transmit"

    # Partition
    partition-column = "audit_load_date"
    date-format      = "yyyy-MM-dd"

    # Dedup primary keys — used for LEFT ANTI JOIN against target
    primary-keys = ["event_id"]

    # How many days of target data to read for dedup
    dedup-lookback-days = 2

    # Optional: fully qualified class name of custom transformer (runs AFTER flatten)
    custom-transformer-class = ""

    # Optional: fully qualified class name of custom flattener (replaces groups-based flatten)
    custom-flatten-class = ""

    # Optional: any extra key-value params your custom classes need
    # Access via: AppConfig.application.param("key") or extraParams("key")
    extra-params {
        # source-system = "payments"
        # threshold     = "1000"
        # date-column   = "transaction_date"
    }

    # JSON field mappings: group columns by common path
    # Format: "sourceField" or "sourceField:outputColumn" to rename
    # Types default to string — override below in type-overrides
    json {
        groups = [
            { path = "",             columns = "event_id, event_timestamp" }
            { path = "customer",     columns = "customer_id, first_name, last_name, risk_rating" }
            { path = "contact",      columns = "email, phone_mobile" }
            { path = "address",      columns = "city, state, country" }
            { path = "loan_account", columns = "account_id, loan_amount, interest_rate" }
            { path = "delinquency",  columns = "days_past_due, bucket" }
        ]

        type-overrides = [
            { name = "loan_amount",   type = "integer" }
            { name = "interest_rate", type = "double"  }
            { name = "days_past_due", type = "integer" }
        ]
    }
}

# =============================================================================
# FILTER
# =============================================================================
filter {
    # Records matching ALL rules are KEPT
    rules = [
        { field = "event_id",    operator = "is_not_null" }
        { field = "customer_id", operator = "is_not_null" }
    ]
}

# =============================================================================
# ERROR
# =============================================================================
error {
    error-path           = "/tmp/streaming-output/kafka-to-hive-transmit-errors"
    enable-error-capture = true
}

# =============================================================================
# SPARK-CONFS — common --conf entries passed to spark-submit by run.sh
#
# Rules: HOCON array of quoted strings, one "spark.key=value" per element.
# No leading "--conf" (run.sh prepends it). No command substitution ($() or `).
#
# These entries are DUPLICATED in every per-env file so that run.sh, which
# parses only the chosen env file's literal text, sees the full list.
# Accept this duplication — do not build a JVM-based resolver.
# =============================================================================
spark-confs = [
    "spark.sql.adaptive.enabled=true"
    "spark.sql.shuffle.partitions=200"
]